name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q
      - name: Rebuild dashboard evidence
        run: python scripts/build_dashboard_data.py
      - name: Check generated evidence is committed
        run: git diff --exit-code -- dashboard/data.json
